{% set name = "reprostim" %}
{% set version = "0.7.38" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/reprostim-{{ version }}.tar.gz
  sha256: d1018534f1153160f094997ed56e53253ab30b47be1c4ae720f64b0995da51ea

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  entry_points:
    - reprostim = reprostim.cli.entrypoint:main

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=46.4.0
    - pip
    - hatchling
    - versioningit
  run:
    - python >={{ python_min }}
    - click >=8.1.7
    - click-didyoumean >=0.3.1
    - pydantic >=2.7.1
    - numpy >=1.26.4
    - qrcode >=8.0
    - opencv >=4.9.0
    - pyzbar =0.1.9
    - filelock >=3.16.0
    - isodate >=0.7.2
    - pyyaml >=6.0
    - jsonlines >=4.0.0
    - pandas >=2.2.2
    - linkml >=1.9.0
    - requests >=2.34.2

test:
  imports:
    - reprostim
  commands:
    - python -m pytest -vv tests
  requires:
    - python {{ python_min }}
    - pytest
    - pytest-cov
    - reedsolo >=1.7.0
    - scipy
    - pytest-mock
    - psutil >=5.9.0
    - pyudev >=0.23.0
    - python-xlib >=0.33
  source_files:
    - tests

about:
  home: https://github.com/ReproNim/reprostim/
  summary: ReproStim is a video capture and recording suite for neuroimaging and psychology experiments
  license: MIT
  license_family: MIT
  license_file: LICENSES/MIT.txt

extra:
  recipe-maintainers:
    - yarikoptic
    - vmdocua
